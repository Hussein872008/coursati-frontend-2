<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)" />

  <!-- open book shape -->
  <g transform="translate(64,112)" filter="url(#soft)">
    <path d="M0 40 C80 0 160 0 240 40 L240 240 C160 200 80 200 0 240 Z" fill="#ffffff" opacity="0.06" />
    <path d="M32 56 C96 28 144 28 208 56 L208 208 C144 180 96 180 32 208 Z" fill="#ffffff" opacity="0.08" />
    <path d="M240 40 C320 0 400 0 480 40 L480 240 C400 200 320 200 240 240 Z" fill="#ffffff" opacity="0.06" transform="translate(-16,0)" />
    <path d="M272 56 C336 28 384 28 448 56 L448 208 C384 180 336 180 272 208 Z" fill="#ffffff" opacity="0.08" transform="translate(-16,0)" />

    <!-- left pages lines -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" transform="translate(28,86)">
      <path d="M0 0 C40 -12 80 -12 120 0" />
      <path d="M0 28 C40 16 80 16 120 28" />
      <path d="M0 56 C40 44 80 44 120 56" />
    </g>

    <!-- right pages lines -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" transform="translate(292,86)">
      <path d="M0 0 C40 -12 80 -12 120 0" />
      <path d="M0 28 C40 16 80 16 120 28" />
      <path d="M0 56 C40 44 80 44 120 56" />
    </g>
  </g>

  <!-- play button circle -->
  <g transform="translate(176,176)">
    <circle cx="80" cy="80" r="72" fill="#0ea5b7" stroke="#ffffff22" stroke-width="6" />
    <polygon points="100,80 60,108 60,52" fill="#fff" transform="translate(0,0)" />
  </g>

  <!-- subtle label (small) -->
  <text x="256" y="468" text-anchor="middle" font-family="Cairo, system-ui, Arial" font-size="20" fill="#ffffffcc">كورساتي</text>
</svg>
